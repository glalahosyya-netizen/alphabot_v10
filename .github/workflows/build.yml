name: Build ALPHABOT APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Add Android platform
        run: |
          flutter create --platforms=android --project-name alphabot_v10 --org com.alphabot /tmp/scaffold
          cp -R /tmp/scaffold/android ./android

      - name: Update Android Manifest
        run: |
          cat << 'EOF' > /tmp/update_manifest.py
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              manifest = f.read()

          permissions = '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n'
          queries = '''    <queries>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <data android:scheme="https" />
              </intent>
          </queries>
          '''

          if '<uses-permission android:name="android.permission.RECORD_AUDIO"/>' not in manifest:
              manifest = manifest.replace('<application', permissions + queries + '    <application')

          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(manifest)
          EOF
          python3 /tmp/update_manifest.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alphabot-v10-apk
          path: build/app/outputs/flutter-apk/app-release.apk
